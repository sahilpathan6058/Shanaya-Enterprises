<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Electronics product placeholder</title>
  <desc id="desc">A clean placeholder image for electronics product cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="40" fill="url(#bg)" />
  <circle cx="118" cy="108" r="58" fill="#dbeafe" />
  <circle cx="700" cy="514" r="72" fill="#dcfce7" />

  <rect x="88" y="114" width="388" height="236" rx="28" fill="#0f172a" />
  <rect x="112" y="138" width="340" height="188" rx="20" fill="url(#screen)" />
  <rect x="244" y="350" width="76" height="18" rx="9" fill="#475569" />
  <rect x="206" y="368" width="152" height="20" rx="10" fill="#64748b" />

  <rect x="540" y="152" width="156" height="238" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="8" />
  <rect x="570" y="190" width="96" height="112" rx="16" fill="#bfdbfe" />
  <rect x="578" y="324" width="82" height="16" rx="8" fill="#94a3b8" />
  <rect x="578" y="352" width="58" height="16" rx="8" fill="#cbd5e1" />

  <rect x="110" y="446" width="580" height="70" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />
  <text x="144" y="489" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">
    Electronics Product Image
  </text>
  <text x="144" y="544" fill="#475569" font-family="Arial, sans-serif" font-size="24" font-weight="600">
    Replace this file later with real shop product photos
  </text>
</svg>
